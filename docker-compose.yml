services:
  db:
    image: postgres:16
    container_name: customerpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: customerpulse
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d customerpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
